apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-backend
  labels:
    project: counter
spec:
  revisionHistoryLimit: 0
  replicas: 2
  selector:
    matchLabels:
      app: counter-backend
  template:
    metadata:
      labels:
        app: counter-backend
        project: counter
    spec:
      containers:
        - name: main
          image: ghcr.io/ondrejsika/counter
          ports:
            - containerPort: 8000
          env:
            - name: REDIS
              value: redis
            - name: SLOW_START
              value: '10'
            - name: EXTRA_TEXT
              value: v1
          startupProbe:
            periodSeconds: 1
            failureThreshold: 60
            httpGet:
              path: /readyz
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 40Mi

