apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: counter-backend-netpol
  labels:
    project: counter
spec:
  podSelector:
    matchLabels:
      app: counter-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from frontend
    - from:
      - podSelector:
          matchLabels:
            app: counter-frontend
      ports:
        - protocol: TCP
          port: 8000
    # Allow traffic from ingress controllers (nginx and openshift)
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      - namespaceSelector:
          matchLabels:
            name: openshift-ingress
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow traffic to Redis
    - to:
      - podSelector:
          matchLabels:
            app: redis
      ports:
        - protocol: TCP
          port: 6379
