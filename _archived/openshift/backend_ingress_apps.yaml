apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: counter-backend-apps
  labels:
    project: counter
  annotations:
    # Tell the Ingress→Route controller how to terminate TLS on the generated Route
    route.openshift.io/termination: edge
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
spec:
  ingressClassName: openshift-default
  rules:
    - host: counter-backend-ondrejsika.apps.ica7.germanywestcentral.aroapp.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: counter-backend
                port:
                  number: 80
